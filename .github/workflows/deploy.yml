name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # 毎日 15:05 UTC ＝ 日本時間 翌 0:05 に再ビルドする。
    # お祭りの応募締切（src/lib/omatsu.ts の deadlineDate）を過ぎたプロジェクトを
    # 日付が変わったタイミングで自動的に「募集終了」の表示へ切り替えるため。
    - cron: '5 15 * * *'
  repository_dispatch:
    types: [microcms-webhook]
  # microCMS の Webhook（GitHub Actions連携）→ repository_dispatch で自動トリガー

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
