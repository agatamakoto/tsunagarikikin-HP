name = "saijo-monthly-donation"
main = "index.js"
compatibility_date = "2024-11-01"

# 許可するオリジン（末尾スラッシュなし）※本番運用のため escf.jp に限定済み
[vars]
ALLOW_ORIGIN = "https://escf.jp"

# 銀行振込（都度寄付）の振込先口座 ※振込案内メールの本文に記載されます
# サイト側の表示は src/lib/donationConfig.ts の BANK_TRANSFER に同じ内容を設定します。
# BANK_ACCOUNT_HOLDER（カナ名義）は空にするとメールに表示されません。
BANK_NAME = "GMOあおぞらネット銀行"
BANK_BRANCH = "法人第二営業部"
BANK_ACCOUNT_TYPE = "普通"
BANK_ACCOUNT_NUMBER = "1877830"
BANK_ACCOUNT_HOLDER = "ザイ)エヒメサイジヨウツナガリキキン"
BANK_ACCOUNT_HOLDER_KANJI = "公益財団法人えひめ西条つながり基金"

# シークレット鍵は vars に書かず、下記コマンドで登録します（本番/テストで切替）：
#   npx wrangler secret put PAYJP_SECRET_KEY
#   → プロンプトに sk_test_… または sk_live_… を貼り付け

[[kv_namespaces]]
binding = "DONORS"
id = "7c1fa034d2964acebc8319982a9b3428"

# サンクスメール送信（Resend経由）※Resendでescf.jpのドメイン認証（DNS）が完了してから有効化
#   1. https://resend.com でAPIキーを発行
#   2. npx wrangler secret put RESEND_API_KEY  → プロンプトにAPIキーを貼り付け
#   3. npx wrangler deploy
#   （RESEND_API_KEY が無い間、Workerのメール送信は自動的にスキップされます。決済には影響しません）

# 寄付者台帳への自動追記（Google Apps Script Web App 経由・GCP不要）
#   1. スプレッドシートの 拡張機能→Apps Script に受け取り用スクリプトを設置しWeb App公開
#   2. npx wrangler secret put SHEETS_WEBHOOK_URL     → Web AppのURL(/exec)を貼り付け
#   3. npx wrangler secret put SHEETS_WEBHOOK_SECRET  → スクリプトと同じ合言葉を貼り付け
#   4. npx wrangler deploy
#   （SHEETS_WEBHOOK_URL が無い間、台帳追記は自動的にスキップされます。決済には影響しません）
